<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Stores</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  --gold:         #c9a44a;
  --gold-light:   #e8c96a;
  --gold-dim:     #8a6a2a;
  --amber:        #d4873a;
  --bg-dark:      #0d0a06;
  --bg-panel:     rgba(10, 7, 3, 0.96);
  --bg-card:      rgba(18, 13, 6, 0.97);
  --border:       rgba(201, 164, 74, 0.45);
  --border-hover: rgba(201, 164, 74, 0.88);
  --text-main:    #e8d8b0;
  --text-muted:   #8a7a5a;
  --green:        #4ecb7a;
  --yellow:       #f1c40f;
  --shadow:       0 8px 40px rgba(0,0,0,0.85);

  --scale: 1;
}

@media (max-height: 800px)                         { :root { --scale: 0.78; } }
@media (min-height: 801px) and (max-height: 1200px){ :root { --scale: 1;    } }
@media (min-height: 1201px)                        { :root { --scale: 1.28; } }

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0; padding: 0;
  font-family: 'Crimson Pro', Georgia, serif;
  background: transparent;
  height: 100vh;
  overflow: hidden;
}

.ornament {
  text-align: center;
  color: var(--gold-dim);
  font-size: calc(10px * var(--scale));
  letter-spacing: 4px;
  margin: calc(4px * var(--scale)) 0;
  user-select: none;
  opacity: 0.7;
}

#menuMain, #menuBuy, #menuSell {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 1000;
  display: none;
  border-radius: calc(10px * var(--scale));
  overflow: hidden;
}

#menuMain {
  width: calc(380px * var(--scale));
  border: 1px solid var(--border);
}

#menuMain::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: url(shop.png);
  background-size: cover;
  background-position: center;
  z-index: 0;
}

#menuMain::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(160deg, rgba(10,7,3,0.78) 0%, rgba(10,7,3,0.90) 100%);
  pointer-events: none;
  z-index: 0;
}

#mainMenu {
  position: relative;
  z-index: 1;
  padding: calc(28px * var(--scale)) calc(28px * var(--scale)) calc(20px * var(--scale));
  display: flex;
  flex-direction: column;
  gap: calc(10px * var(--scale));
}

#menuBuy, #menuSell {
  background: var(--bg-panel);
  border: 2px solid var(--border);
  width: calc(780px * var(--scale));
  height: calc(700px * var(--scale));
  padding: calc(20px * var(--scale)) calc(24px * var(--scale)) calc(16px * var(--scale));
  flex-direction: column;
}

h1 {
  font-family: 'Cinzel Decorative', serif;
  font-size: calc(20px * var(--scale));
  font-weight: 700;
  color: var(--gold-light);
  text-align: center;
  margin: 0 0 calc(8px * var(--scale));
  text-shadow: 0 0 20px rgba(201,164,74,0.5), 0 2px 4px rgba(0,0,0,0.8);
  letter-spacing: 2px;
}

h2 {
  font-family: 'Cinzel', serif;
  font-size: calc(15px * var(--scale));
  font-weight: 600;
  color: var(--gold-light);
  text-align: center;
  margin: 0 0 calc(4px * var(--scale));
  text-shadow: 0 0 16px rgba(201,164,74,0.4);
  letter-spacing: 3px;
  text-transform: uppercase;
}

.corner-ornament {
  position: absolute;
  width: calc(18px * var(--scale));
  height: calc(18px * var(--scale));
  z-index: 2;
  opacity: 0.6;
  pointer-events: none;
}
.corner-ornament.tl { top:calc(8px*var(--scale)); left:calc(8px*var(--scale));   border-top:2px solid var(--gold); border-left:2px solid var(--gold);   border-radius:2px 0 0 0; }
.corner-ornament.tr { top:calc(8px*var(--scale)); right:calc(8px*var(--scale));  border-top:2px solid var(--gold); border-right:2px solid var(--gold);  border-radius:0 2px 0 0; }
.corner-ornament.bl { bottom:calc(8px*var(--scale)); left:calc(8px*var(--scale));  border-bottom:2px solid var(--gold); border-left:2px solid var(--gold);  border-radius:0 0 0 2px; }
.corner-ornament.br { bottom:calc(8px*var(--scale)); right:calc(8px*var(--scale)); border-bottom:2px solid var(--gold); border-right:2px solid var(--gold); border-radius:0 0 2px 0; }

button {
  font-family: 'Cinzel', serif;
  display: block;
  width: 100%;
  padding: calc(11px * var(--scale)) calc(14px * var(--scale));
  font-size: calc(13px * var(--scale));
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  background: linear-gradient(135deg, rgba(201,164,74,0.10) 0%, rgba(201,164,74,0.04) 100%);
  border: 1px solid var(--border);
  border-radius: calc(8px * var(--scale));
  color: var(--gold);
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s, color 0.2s, box-shadow 0.2s;
}

button:hover {
  border-color: var(--border-hover);
  color: var(--gold-light);
  background: linear-gradient(135deg, rgba(201,164,74,0.20) 0%, rgba(201,164,74,0.08) 100%);
  box-shadow: 0 0 14px rgba(201,164,74,0.18);
}

.categoria-btn {
  padding: calc(5px * var(--scale)) calc(12px * var(--scale));
  font-family: 'Cinzel', serif;
  font-size: calc(12.5px * var(--scale));
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  background: rgba(201,164,74,0.06);
  border: 1px solid var(--border);
  border-radius: calc(20px * var(--scale));
  color: var(--gold);
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.18s, border-color 0.18s, color 0.18s;
  width: auto;
}

.categoria-btn:hover,
.categoria-btn.activa {
  background: rgba(201,164,74,0.18);
  border-color: var(--gold);
  color: var(--gold-light);
}

.categoria-btn.activa {
  box-shadow: 0 0 8px rgba(201,164,74,0.2);
}

.section {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(calc(148px * var(--scale)), 1fr));
  grid-auto-rows: calc(250px * var(--scale));
  gap: calc(12px * var(--scale));
  overflow-y: auto;
  flex: 1;
  min-height: 0;
  margin-bottom: calc(10px * var(--scale));
  scrollbar-width: thin;
  scrollbar-color: var(--gold-dim) transparent;
  padding-right: calc(4px * var(--scale));
  align-content: start;
}

.section::-webkit-scrollbar       { width: calc(5px * var(--scale)); }
.section::-webkit-scrollbar-track { background: transparent; }
.section::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 3px; }

.item-row {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  background: var(--bg-card);
  padding: calc(10px * var(--scale)) calc(8px * var(--scale));
  border: 1px solid var(--border);
  border-radius: calc(12px * var(--scale));
  height: calc(250px * var(--scale));
  position: relative;
  overflow: hidden;
  border-top-color: rgba(201,164,74,0.55);
  transition: border-color 0.2s, box-shadow 0.2s;
}

.item-row:hover {
  border-color: var(--border-hover);
  box-shadow: 0 0 18px rgba(201,164,74,0.10), 0 4px 18px rgba(0,0,0,0.5);
}

.item-img-wrap {
  position: relative;
  width: calc(72px * var(--scale));
  height: calc(72px * var(--scale));
  border-radius: calc(10px * var(--scale));
  overflow: hidden;
  flex-shrink: 0;
  border: 1px solid rgba(201,164,74,0.2);
}

.item-row img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  border-radius: inherit;
  transition: transform 0.25s ease;
}

.item-row:hover img { transform: scale(1.06); }

.item-info {
  text-align: center;
  padding: 0 calc(4px * var(--scale));
  width: 100%;
}

.item-info .nombre {
  display: block;
  font-family: 'Cinzel', serif;
  font-size: calc(11.5px * var(--scale));
  font-weight: 600;
  color: var(--text-main);
  margin-bottom: calc(2px * var(--scale));
  letter-spacing: 0.5px;
  line-height: 1.3;
}

.item-info .precio {
  font-family: 'Roboto Mono', monospace;
  font-size: calc(13px * var(--scale));
  font-weight: 500;
  display: block;
}

.item-input {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: calc(6px * var(--scale));
}

.item-input button {
  width: calc(26px * var(--scale));
  height: calc(26px * var(--scale));
  border-radius: 50%;
  border: 1px solid var(--border);
  background: rgba(201,164,74,0.1);
  color: var(--gold);
  cursor: pointer;
  font-weight: 700;
  font-size: calc(15px * var(--scale));
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 0;
  line-height: 1;
}

.item-input input {
  width: calc(42px * var(--scale));
  height: calc(26px * var(--scale));
  text-align: center;
  border: 1px solid var(--border);
  border-radius: calc(6px * var(--scale));
  padding: 2px;
  font-family: 'Roboto Mono', monospace;
  font-size: calc(13px * var(--scale));
  background: rgba(201,164,74,0.06);
  color: var(--gold-light);
}

.item-input input::-webkit-inner-spin-button,
.item-input input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

.item-actions {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: calc(5px * var(--scale));
  width: 100%;
}

.item-actions button {
  padding: calc(5px * var(--scale)) calc(8px * var(--scale));
  font-size: calc(10px * var(--scale));
  background: rgba(201,164,74,0.10);
  border: 1px solid var(--border);
  border-radius: calc(8px * var(--scale));
  flex: 2;
}

.item-actions button:hover {
  background: rgba(201,164,74,0.24);
  border-color: var(--gold);
  color: var(--gold-light);
}

.item-actions .max-btn {
  flex: 1;
}

.back-btn {
  background: transparent !important;
  border: 1px solid rgba(201,164,74,0.3) !important;
  color: var(--text-muted) !important;
  font-size: calc(11px * var(--scale)) !important;
  padding: calc(7px * var(--scale)) !important;
  letter-spacing: 2px;
  flex-shrink: 0;
}

.back-btn:hover {
  border-color: var(--border-hover) !important;
  color: var(--gold) !important;
  background: rgba(201,164,74,0.05) !important;
}

.section.empty {
  display: flex;
  justify-content: center;
  align-items: center;
}

.sin-objetos {
  color: var(--text-muted);
  font-family: 'Cinzel', serif;
  font-size: calc(14px * var(--scale));
  text-align: center;
  letter-spacing: 2px;
  line-height: 2;
}

.container-merchant {
  position: fixed;
  right: 2%;
  bottom: 8%;
  width: calc(160px * var(--scale));
  padding: calc(12px * var(--scale));
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: calc(14px * var(--scale));
  box-shadow: var(--shadow);
  display: none;
  z-index: 1000;
}

.title-merchant {
  font-family: 'Cinzel', serif;
  font-size: calc(13px * var(--scale));
  font-weight: 600;
  color: var(--gold);
  margin: 0;
  word-wrap: break-word;
  letter-spacing: 0.5px;
  line-height: 1.5;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translate(-50%, -48%); }
  to   { opacity: 1; transform: translate(-50%, -50%); }
}

#menuMain[style*="block"],
#menuBuy[style*="flex"],
#menuSell[style*="flex"] {
  animation: fadeIn 0.18s ease forwards;
}
</style>
</head>
<body>

<div id="menuMain">
  <div class="corner-ornament tl"></div>
  <div class="corner-ornament tr"></div>
  <div class="corner-ornament bl"></div>
  <div class="corner-ornament br"></div>
  <div id="mainMenu">
    <h1 id="tituloTienda"></h1>
    <div class="ornament">✦ ─────── ✦</div>
    <button id="btnComprar" onclick="openBuyMenu()"></button>
    <button id="btnVender"  onclick="openSellMenu()"></button>
    <div class="ornament">✦ ─────── ✦</div>
    <button class="close-btn" onclick="closeAllMenus()"></button>
  </div>
</div>

<div id="menuBuy">
  <h2 id="tituloBuy"></h2>
  <div class="ornament">· ─── ✦ ─── ·</div>
  <div class="categorias-bar"></div>
  <div id="buyItems" class="section"></div>
  <button class="back-btn" onclick="backToMain()">Volver</button>
</div>

<div id="menuSell">
  <h2 id="tituloSell"></h2>
  <div class="ornament">· ─── ✦ ─── ·</div>
  <div class="categorias-bar"></div>
  <div id="sellItems" class="section"></div>
  <button class="back-btn" onclick="backToMain()">Volver</button>
</div>

<div class="container-merchant">
  <div class="title-merchant" id="merchantText"></div>
</div>

<script>
let buyData = [];
let sellData = [];
let mostrarComprar = true;
let mostrarVender  = true;
let categoriasComprar = [];
let categoriasVender  = [];
let categoriaActualCompra = "";
let categoriaActualVenta  = "";
let textos = {};
let tiendaIdActual = null;

window.addEventListener("message", function(event) {
  const data = event.data;
  const merchant     = document.querySelector('.container-merchant');
  const merchantText = document.getElementById('merchantText');

  if (data.type === "open") {
    buyData           = data.buyItems  || [];
    sellData          = data.sellItems || [];
    mostrarComprar    = data.mostrarComprar;
    mostrarVender     = data.mostrarVender;
    categoriasComprar = Array.isArray(data.categoriasComprar) ? data.categoriasComprar : [];
    categoriasVender  = Array.isArray(data.categoriasVender)  ? data.categoriasVender  : [];
    textos            = data.textos || {};
    tiendaIdActual    = data.tiendaId || null;

    document.getElementById("tituloTienda").textContent = data.titulo || textos.titulo || "";
    document.getElementById("btnComprar").textContent   = textos.btnComprar  || "";
    document.getElementById("btnVender").textContent    = textos.btnVender   || "";
    document.querySelector(".close-btn").textContent    = textos.btnCerrar   || "";
    document.getElementById("tituloBuy").textContent    = textos.tituloComprar || "";
    document.getElementById("tituloSell").textContent   = textos.tituloVender  || "";

    document.getElementById("btnComprar").style.display = mostrarComprar ? "block" : "none";
    document.getElementById("btnVender").style.display  = mostrarVender  ? "block" : "none";
    document.getElementById("menuMain").style.display   = "block";
  }

  if (data.type === 'showmerchant') {
    merchantText.textContent = data.text || '';
    merchant.style.display   = 'block';
  }

  if (data.type === 'hidemerchant') {
    merchant.style.display = 'none';
  }
});

function renderCategoriasBar(categorias, tipo) {
  const panelId = tipo === "buy" ? "menuBuy" : "menuSell";
  const panel   = document.getElementById(panelId);
  const bar     = panel.querySelector(".categorias-bar");
  bar.innerHTML = "";

  if (!categorias || categorias.length === 0) {
    bar.style.display = "none";
    return;
  }

  Object.assign(bar.style, {
    display: "flex",
    flexWrap: "wrap",
    gap: "calc(6px * var(--scale))",
    marginBottom: "calc(10px * var(--scale))",
    paddingBottom: "calc(10px * var(--scale))",
    borderBottom: "1px solid var(--border)",
    flexShrink: "0"
  });

  categorias.forEach((cat, idx) => {
    const btn = document.createElement("button");
    btn.textContent = cat;
    btn.className   = "categoria-btn" + (idx === 0 ? " activa" : "");
    btn.onclick = () => {
      bar.querySelectorAll(".categoria-btn").forEach(b => b.classList.remove("activa"));
      btn.classList.add("activa");
      if (tipo === "buy") {
        categoriaActualCompra = cat;
        renderItems("buyItems", buyData, cat, "buy");
      } else {
        categoriaActualVenta = cat;
        renderItems("sellItems", sellData, cat, "sell");
      }
    };
    bar.appendChild(btn);
  });
}

function openBuyMenu() {
  document.getElementById("menuMain").style.display = "none";
  document.getElementById("menuSell").style.display = "none";
  document.getElementById("menuBuy").style.display  = "flex";
  categoriaActualCompra = categoriasComprar[0] || textos.sinCategoria || "";
  renderCategoriasBar(categoriasComprar, "buy");
  renderItems("buyItems", buyData, categoriaActualCompra, "buy");
}

function openSellMenu() {
  document.getElementById("menuMain").style.display = "none";
  document.getElementById("menuBuy").style.display  = "none";
  document.getElementById("menuSell").style.display = "flex";
  categoriaActualVenta = categoriasVender[0] || textos.sinCategoria || "";
  renderCategoriasBar(categoriasVender, "sell");
  renderItems("sellItems", sellData, categoriaActualVenta, "sell");
}

function backToMain() {
  document.getElementById("menuBuy").style.display  = "none";
  document.getElementById("menuSell").style.display = "none";
  document.getElementById("menuMain").style.display = "block";
}

function closeAllMenus() {
  document.getElementById("menuMain").style.display = "none";
  document.getElementById("menuBuy").style.display  = "none";
  document.getElementById("menuSell").style.display = "none";
  fetch(`https://${GetParentResourceName()}/close`, { method: "POST" });
}

function renderItems(containerId, data, categoria, tipo) {
  const container = document.getElementById(containerId);
  container.innerHTML = "";

  const filtrados = data.filter(item => !item.categoria || item.categoria === categoria);

  if (filtrados.length === 0) {
    container.classList.add("empty");
    container.innerHTML = `<p class="sin-objetos">${textos.sinObjetos || "Sin artículos disponibles"}</p>`;
    return;
  }

  container.classList.remove("empty");
  const frag = document.createDocumentFragment();

  filtrados.forEach(item => {
    const simbolo       = item.moneda === "gold" ? textos.monedaGold : textos.monedaDollar;
    const color         = item.moneda === "gold" ? "var(--yellow)" : "var(--green)";
    const precioNatural = item.price % 1 === 0 ? item.price.toFixed(0) : item.price.toString();

    const row = document.createElement("div");
    row.className = "item-row";
    row.innerHTML = `
      <div class="item-info">
        <span class="nombre">${item.label}</span>
      </div>
      <div class="item-img-wrap">
        <img src="${item.img}" alt="${item.label}" loading="lazy">
      </div>
      <div class="item-info">
        <span class="precio" style="color:${color}">${precioNatural} ${simbolo}</span>
      </div>
      <div class="item-input">
        <button onclick="changeQuantity('${tipo}_${item.item}', -1)">−</button>
        <input type="number" min="1" step="1" value="1"
          ${tipo === "sell" ? `max="${item.cantidad}"` : ""}
          id="${tipo}_${item.item}">
        <button onclick="changeQuantity('${tipo}_${item.item}', 1)">+</button>
      </div>
      <div class="item-actions">
        <button onclick="${tipo}('${item.item}')">${tipo === "buy" ? textos.btnAccionComprar : textos.btnAccionVender}</button>
        ${tipo === "sell" ? `<button class="max-btn" onclick="setMax('${item.item}')">${textos.btnMax || 'Max'}</button>` : ""}
      </div>
    `;
    frag.appendChild(row);

    if (tipo === "sell") {
      const inputEl = row.querySelector(`#sell_${item.item}`);
      inputEl.addEventListener('input', () => {
        const v = parseInt(inputEl.value);
        if (v > item.cantidad) inputEl.value = item.cantidad;
        else if (v < 1)        inputEl.value = 1;
      });
    }
  });

  container.appendChild(frag);
}

function changeQuantity(inputId, delta) {
  const input = document.getElementById(inputId);
  if (!input) return;
  let val  = (parseInt(input.value) || 1) + delta;
  const mx = input.max ? parseInt(input.max) : Infinity;
  input.value = Math.min(Math.max(val, 1), mx);
}

function setMax(itemName) {
  const item = sellData.find(i => i.item === itemName);
  if (!item) return;
  document.getElementById(`sell_${itemName}`).value = item.cantidad;
}

function buy(itemName) {
  const cantidad = parseInt(document.getElementById(`buy_${itemName}`).value);
  if (cantidad > 0) {
    fetch(`https://${GetParentResourceName()}/buyItem`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ item: itemName, cantidad, tiendaId: tiendaIdActual })
    });
  }
}

function sell(itemName) {
  const input  = document.getElementById(`sell_${itemName}`);
  const item   = sellData.find(i => i.item === itemName);
  if (!item) return;
  let cantidad = Math.min(parseInt(input.value) || 0, item.cantidad);
  if (cantidad <= 0) return;
  fetch(`https://${GetParentResourceName()}/sellItem`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ item: itemName, cantidad, tiendaId: tiendaIdActual })
  });
  item.cantidad -= cantidad;
  if (item.cantidad <= 0) sellData = sellData.filter(i => i.item !== itemName);
  renderItems("sellItems", sellData, categoriaActualVenta, "sell");
}
</script>
</body>
</html>
